
name: Build Fartiqs Client

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle-8.14.3-bin.zip
          echo "$PWD/gradle-8.14.3/bin" >> "$GITHUB_PATH"

      - name: Build the mod
        run: gradle -p FartiqsClient-Rebuild build --no-daemon

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fartiqs-client-build
          path: FartiqsClient-Rebuild/build/libs/*.jar
          if-no-files-found: warn
